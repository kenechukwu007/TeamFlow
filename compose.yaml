services:
  postgres: 
    image: postgres:18
    environment:
      - POSTGRES_DB=teamflow
      - POSTGRES_USER=teamflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Docker-files/api.DockerFile
    image: teamflow-api:local
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - BROKER_ENABLED=true
    depends_on:
       postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Docker-files/web.DockerFile
    image: teamflow-web:local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    healthcheck:
      test: 
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.6-management
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Set RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    hostname: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: teamflow-api:local
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - AMQP_URL=${AMQP_URL:?Set AMQP_URL}
      - AMQP_QUEUE=teamflow.activity.v1
    depends_on:
      api: 
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
        
      


volumes:
  postgres_data:
  rabbitmq_data:
      

